# Builds a debug APK on GitHub. Sideload only — not Play Store signed.
name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'overlay/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Clone MojoLauncher and apply overlay
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          ./scripts/clone-mojo.ps1
          ./scripts/build-agent.ps1
          ./scripts/apply-overlay.ps1

      - name: Gradle assembleDebug
        working-directory: mojo-src
        run: ./gradlew :app_pojavlauncher:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: mc-chat-mojo-debug-apk
          path: mojo-src/app_pojavlauncher/build/outputs/apk/**/*.apk
          if-no-files-found: error
